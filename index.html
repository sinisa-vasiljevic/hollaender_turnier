<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#047857"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180-v102.png"><title>Holländer-Turnier</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#0f172a;font-family:system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:9;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid #e2e8f0}header b{font-size:18px}small{display:block;color:#64748b}.right{text-align:right}.saved{display:inline-block;padding:5px 9px;border-radius:99px;background:#d1fae5;color:#065f46;font-weight:700;font-size:12px}main{max-width:640px;margin:auto;padding:14px 12px 104px}.hero{padding:20px;border-radius:22px;background:linear-gradient(135deg,#047857,#0d9488);color:#fff}.hero h1{margin:4px 0 18px}.g3,.g2{display:grid;gap:9px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.metric,.card{padding:14px;border-radius:18px;background:#fff;box-shadow:0 2px 12px #0f172a12}.hero .metric{text-align:center;background:#ffffff20}.metric b{font-size:24px}.card{margin-top:12px}h2,h3{margin:0 0 10px}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}input,select,textarea,button{font:inherit;border:1px solid #cbd5e1;border-radius:12px;padding:10px;background:#fff;min-width:0}input,select{width:100%}button{font-weight:750}.primary{background:#047857;color:#fff;border-color:#047857}.warn{background:#b91c1c;color:#fff}.big{width:100%;padding:15px}.list{display:grid;gap:8px;margin-top:10px}.pill{padding:3px 7px;border-radius:99px;background:#e2e8f0;font-size:11px;font-weight:800}.green{background:#d1fae5;color:#065f46}.yellow{background:#facc15;color:#422006}.keeperCard{border:2px solid #facc15;background:#fffbea}.keeperBtn{background:#facc15;color:#422006;border-color:#eab308}.game{padding:12px;border-radius:14px;background:#f1f5f9;margin-top:10px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team>b{font-size:12px;color:#047857}.person{margin-top:4px}.identity{display:inline-flex;align-items:center;gap:5px;max-width:100%;font-weight:600}.identity .nm{overflow-wrap:anywhere}.goalie .identity{background:#fff7cc;padding:3px 5px;border-radius:8px}.tw{display:inline-flex;white-space:nowrap;background:#facc15;color:#422006;border-radius:99px;padding:2px 7px;font-size:11px;font-weight:900}.scorebox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.score{display:flex;gap:4px;align-items:center}.score button{width:40px;height:42px}.score input{width:50px;text-align:center;font-size:20px;font-weight:900}.rank{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:10px;border-bottom:1px solid #e2e8f0}.rank .n,.rank .p{font-size:18px;font-weight:900}.rank .p{text-align:right}.tableWrap{overflow-x:auto;background:#fff;border-radius:16px;margin-top:10px}table{border-collapse:collapse;min-width:620px;width:100%;font-size:13px}th,td{padding:9px;text-align:right;border-bottom:1px solid #e2e8f0;white-space:nowrap}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff}.keeperRow td{background:#fffbea}.wizard{position:sticky;bottom:74px;z-index:8;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;margin-top:12px;background:#f8fafcf5;border:1px solid #ddd;border-radius:16px}.exit{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;overflow-x:auto;background:#fff;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;min-width:64px;border:0;border-radius:0;padding:14px 4px;font-size:11px;color:#64748b;white-space:nowrap}nav button.on{color:#047857}.muted{color:#64748b;font-size:13px}@media(max-width:380px){header b{font-size:16px}.saved{font-size:10px}}
</style></head><body><header><div><b id="head">Holländer-Turnier</b><small id="sub">Turnier wird vorbereitet</small></div><div class="right"><span class="saved">Lokal gespeichert</span><small>Version 1.0.2</small></div></header><main id="app"></main><nav id="tabs"></nav><script>
const KEY='ht-v102';const uid=()=>crypto.randomUUID?.()||Math.random().toString(36).slice(2);const seed=['Antonio Sica','Arda Budak','Berkay Ulutas','Burak Korkmaz','David Vasiljević','Dino Hasić','Erdem Uzunok','Eric Serjanaj','Kelvin Rohleder','Kristian Wagner','Lenny Detaro','Leo Llukaci','Luca Behncke','Luis Zimmermann','Maik Tatou','Mats Weinreuter','Raphael Leevi Alvelos','Tan Turhan','Tuna Kuzey Seklem','Viktor Averkin'];
function fresh(){let f=[{id:uid(),name:'Hauptfeld 1',a:5,b:5},{id:uid(),name:'Feld 2',a:3,b:3},{id:uid(),name:'Feld 3',a:3,b:3}],p=seed.map(name=>({id:uid(),name,active:true,keeper:false,field:'',side:''}));p.push({id:uid(),name:'Marc Comsa',active:true,keeper:true,field:f[0].id,side:'A'},{id:uid(),name:'Dominik Wojtysiak',active:true,keeper:true,field:f[0].id,side:'B'});return{name:'Holländer-Turnier',rounds:10,current:1,players:p,fields:f,plan:[],results:{}}}let S=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch{return fresh()}})(),tab='home',step=1;const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{localStorage.setItem(KEY,JSON.stringify(S));render()};const AP=()=>S.players.filter(x=>x.active),cap=()=>S.fields.reduce((n,f)=>n+ +f.a+ +f.b,0),pm=()=>Object.fromEntries(S.players.map(x=>[x.id,x])),fm=()=>Object.fromEntries(S.fields.map(x=>[x.id,x]));
const navs=[['home','Heute'],['setup','Einrichten'],['schedule','Spielplan'],['play','Ergebnisse'],['ranking','Rangliste'],['more','Mehr']];function go(x){tab=x;render()}function render(){head.textContent=S.name;sub.textContent=S.plan.length?`Runde ${S.current} von ${S.rounds}`:'Turnier wird vorbereitet';tabs.innerHTML=navs.map(x=>`<button class="${tab===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');app.innerHTML=({home,setup,schedule,play,ranking,more}[tab]||home)()}
function home(){return`<div class="hero"><small style="color:#d1fae5">Turnierübersicht</small><h1>${esc(S.name)}</h1><div class="g3"><div class="metric"><b>${AP().length}</b><small style="color:#fff">Spieler</small></div><div class="metric"><b>${S.fields.length}</b><small style="color:#fff">Felder</small></div><div class="metric"><b>${S.rounds}</b><small style="color:#fff">Runden</small></div></div></div><div class="g2"><div class="card"><small>Kapazität</small><h2>${cap()}</h2></div><div class="card"><small>Planqualität</small><h2>${quality()??'–'}/100</h2><span class="muted">${done()}/${S.plan.reduce((n,r)=>n+r.games.length,0)} Spiele</span></div></div>${S.plan.length?`<button class="primary big" style="margin-top:12px" onclick="go('play')">Aktuelle Runde öffnen</button><button class="big" style="margin-top:8px" onclick="go('ranking')">Punkteübersicht öffnen</button><button class="big" style="margin-top:8px" onclick="generate(true)">Neu durchmischen</button>`:`<div class="card"><h2>Turnier einrichten</h2><button class="primary big" onclick="go('setup')">Jetzt starten</button></div>`}`}
function setup(){let b='';if(step===1)b=`<div class="card"><h2>1. Turnier</h2><label>Name<input value="${esc(S.name)}" onchange="S.name=this.value;save()"></label><label>Runden<input type="number" min="1" value="${S.rounds}" onchange="S.rounds=Math.max(1,+this.value);invalidate()"></label></div>`;if(step===2)b=`<div class="card"><h2>2. Spieler</h2><div class="row"><input id="np" placeholder="Name"><button class="primary" onclick="addP()">+</button></div><textarea id="bulk" rows="3" placeholder="Ein Name pro Zeile"></textarea><button onclick="bulkP()">Liste hinzufügen</button></div><div class="list">${S.players.map((p,i)=>`<div class="card ${p.keeper?'keeperCard':''}"><div class="row"><input value="${esc(p.name)}" onchange="S.players[${i}].name=this.value;invalidate()"><button class="warn" onclick="delP(${i})">×</button></div><div class="row between"><label><input style="width:auto" type="checkbox" ${p.active?'checked':''} onchange="S.players[${i}].active=this.checked;invalidate()"> aktiv</label><button class="${p.keeper?'keeperBtn':''}" onclick="S.players[${i}].keeper=!S.players[${i}].keeper;invalidate()">${p.keeper?'Torhüter ✓':'Als Torhüter'}</button></div></div>`).join('')}</div>`;if(step===3)b=`<div class="list">${S.fields.map((f,i)=>`<div class="card"><input value="${esc(f.name)}" onchange="S.fields[${i}].name=this.value;invalidate()"><div class="g2"><label>Team A<input type="number" min="1" value="${f.a}" onchange="S.fields[${i}].a=Math.max(1,+this.value);invalidate()"></label><label>Team B<input type="number" min="1" value="${f.b}" onchange="S.fields[${i}].b=Math.max(1,+this.value);invalidate()"></label></div><button class="warn" onclick="delF(${i})">Feld löschen</button></div>`).join('')}</div><button onclick="S.fields.push({id:uid(),name:'Feld '+(S.fields.length+1),a:3,b:3});invalidate()">+ Feld</button><div class="card">${AP().length} Spieler · ${cap()} Plätze</div>`;if(step===4)b=`<div class="card"><h2>4. Fixierungen</h2></div><div class="list">${AP().map(p=>{let i=S.players.indexOf(p);return`<div class="card ${p.keeper?'keeperCard':''}"><span class="identity"><span class="nm">${esc(p.name)}</span>${p.keeper?'<span class="tw">TW</span>':''}</span><div class="g2"><select onchange="S.players[${i}].field=this.value;invalidate()"><option value="">Feld frei</option>${S.fields.map(f=>`<option value="${f.id}" ${p.field===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select><select onchange="S.players[${i}].side=this.value;invalidate()"><option value="">Seite frei</option><option ${p.side==='A'?'selected':''}>A</option><option ${p.side==='B'?'selected':''}>B</option></select></div></div>`}).join('')}</div>`;return`<div class="exit"><button onclick="go('home')">✕ Verlassen</button><b>Schritt ${step}/4</b></div>${b}<div class="wizard"><button ${step===1?'disabled':''} onclick="step=Math.max(1,step-1);render()">← Zurück</button>${step<4?`<button class="primary" onclick="step++;render()">Weiter →</button>`:`<button class="primary" onclick="generate(false)">Spielplan erstellen</button>`}</div>`}
function invalidate(){S.plan=[];S.results={};save()}function addP(){let n=np.value.trim();if(n&&!S.players.some(x=>x.name.toLowerCase()===n.toLowerCase())){S.players.push({id:uid(),name:n,active:true,keeper:false,field:'',side:''});invalidate()}}function bulkP(){bulk.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(n=>{if(!S.players.some(x=>x.name.toLowerCase()===n.toLowerCase()))S.players.push({id:uid(),name:n,active:true,keeper:false,field:'',side:''})});invalidate()}function delP(i){if(confirm('Spieler löschen?')){S.players.splice(i,1);invalidate()}}function delF(i){if(confirm('Feld löschen?')){let x=S.fields[i].id;S.fields.splice(i,1);S.players.forEach(p=>{if(p.field===x)p.field=''});invalidate()}}
function generate(remix){let P=AP(),F=S.fields;if(P.length<cap())return alert(`${cap()-P.length} Spieler fehlen.`);let best=null;for(let z=0;z<140;z++){let ct=Object.fromEntries(P.map(p=>[p.id,{A:0,B:0,f:{},m:{},g:0,r:0}])),plan=[],bad=false;for(let rn=1;rn<=S.rounds;rn++){let av=[...P],games=F.map(f=>({id:uid(),fieldId:f.id,teamA:[],teamB:[]}));for(let g of games){let f=F.find(x=>x.id===g.fieldId);for(let p of av.filter(x=>x.field===f.id)){let side=p.side||(ct[p.id].A>ct[p.id].B?'B':'A'),arr=side==='A'?g.teamA:g.teamB,max=side==='A'?f.a:f.b;if(arr.length>=max){bad=true;break}arr.push(p.id)}let used=new Set(games.flatMap(x=>[...x.teamA,...x.teamB]));av=av.filter(x=>!used.has(x.id))}if(bad)break;let slots=[];games.forEach(g=>{let f=F.find(x=>x.id===g.fieldId);for(let i=g.teamA.length;i<f.a;i++)slots.push([g,f,'A']);for(let i=g.teamB.length;i<f.b;i++)slots.push([g,f,'B'])});slots.sort(()=>Math.random()-.5);for(let [g,f,s] of slots){let ar=s==='A'?g.teamA:g.teamB,c=av.filter(p=>!p.field&&(!p.side||p.side===s));if(!c.length){bad=true;break}c.sort((p,q)=>cost(p,ct[p.id],f,s,ar)-cost(q,ct[q.id],f,s,ar));let p=c[0];ar.push(p.id);av=av.filter(x=>x.id!==p.id)}if(bad)break;games.forEach(g=>[['A',g.teamA],['B',g.teamB]].forEach(([s,ids])=>ids.forEach(x=>{let c=ct[x];c[s]++;c.g++;c.f[g.fieldId]=(c.f[g.fieldId]||0)+1;ids.filter(y=>y!==x).forEach(y=>c.m[y]=(c.m[y]||0)+1)})));av.forEach(x=>ct[x.id].r++);plan.push({round:rn,games,resting:av.map(x=>x.id)})}if(!bad&&plan.length===S.rounds){let q=qual(plan);if(!best||q>best.q)best={plan,q}}}if(!best)return alert('Keine gültige Verteilung gefunden.');if(remix&&S.plan.length&&!confirm('Plan und Ergebnisse ersetzen?'))return;S.plan=best.plan;S.results={};S.current=1;save();go('schedule')}function cost(p,c,f,s,a){return c.g*8+(c.f[f.id]||0)*5+c[s]*4+a.reduce((n,x)=>n+(c.m[x]||0)*5,0)+Math.random()*3}function qual(pl){let P=AP(),st=Object.fromEntries(P.map(p=>[p.id,{A:0,B:0,f:{},m:{},g:0,r:0}]));pl.forEach(r=>{r.resting.forEach(x=>st[x].r++);r.games.forEach(g=>[['A',g.teamA],['B',g.teamB]].forEach(([s,ids])=>ids.forEach(x=>{let t=st[x];t[s]++;t.g++;t.f[g.fieldId]=(t.f[g.fieldId]||0)+1;ids.filter(y=>y!==x).forEach(y=>t.m[y]=(t.m[y]||0)+1)})))});let pen=0;P.forEach(p=>{let x=st[p.id];if(!p.side)pen+=Math.abs(x.A-x.B)*.6;if(!p.field){let v=S.fields.map(f=>x.f[f.id]||0);pen+=(Math.max(...v)-Math.min(...v))*.7}Object.values(x.m).forEach(n=>{if(n>2)pen+=(n-2)*.25})});return Math.max(50,Math.round(100-pen))}function quality(){return S.plan.length?qual(S.plan):null}
function person(id){let p=pm()[id];return`<div class="person ${p.keeper?'goalie':''}"><span class="identity"><span class="nm">${esc(p.name)}</span>${p.keeper?'<span class="tw">TW</span>':''}</span></div>`}function schedule(){if(!S.plan.length)return empty();return`<div class="row between"><h2>Spielplan</h2><button onclick="generate(true)">Neu mischen</button></div>${S.plan.map(r=>`<div class="card"><h3>Runde ${r.round}</h3>${r.games.map(g=>`<div class="game"><b>${esc(fm()[g.fieldId].name)}</b><div class="teams"><div class="team"><b>TEAM A</b>${g.teamA.map(person).join('')}</div><div class="team"><b>TEAM B</b>${g.teamB.map(person).join('')}</div></div></div>`).join('')}${r.resting.length?`<small>Pause: ${r.resting.map(x=>esc(pm()[x].name)).join(', ')}</small>`:''}</div>`).join('')}`}
function play(){if(!S.plan.length)return empty();let r=S.plan.find(x=>x.round===S.current);return`<div class="row between"><button onclick="S.current=Math.max(1,S.current-1);save()">←</button><h2>Runde ${r.round}</h2><button onclick="S.current=Math.min(S.rounds,S.current+1);save()">→</button></div>${r.games.map(g=>{let z=S.results[g.id]||{a:null,b:null};return`<div class="card"><h3>${esc(fm()[g.fieldId].name)}</h3><div class="teams"><div class="team"><b>TEAM A</b>${g.teamA.map(person).join('')}</div><div class="team"><b>TEAM B</b>${g.teamB.map(person).join('')}</div></div><div class="scorebox">${['a','b'].map(s=>`<div class="score"><button onclick="goal('${g.id}','${s}',-1)">−</button><input type="number" min="0" value="${z[s]??''}" onchange="setGoal('${g.id}','${s}',this.value)"><button class="primary" onclick="goal('${g.id}','${s}',1)">+</button></div>`).join('')}</div></div>`}).join('')}`};function goal(g,s,d){let z=S.results[g]||{a:null,b:null};z[s]=Math.max(0,(z[s]??0)+d);S.results[g]=z;save()}function setGoal(g,s,v){let z=S.results[g]||{a:null,b:null};z[s]=v===''?null:Math.max(0,+v|0);S.results[g]=z;save()}const points=(a,b)=>a>b?3+a-b:a===b?1:0;function done(){return Object.values(S.results).filter(z=>z.a!=null&&z.b!=null).length}
function stats(){let M=Object.fromEntries(S.players.map(p=>[p.id,{...p,sp:0,pt:0,w:0,d:0,l:0,gf:0,ga:0,A:0,B:0,r:0}]));S.plan.forEach(r=>{r.resting.forEach(x=>M[x].r++);r.games.forEach(g=>{let z=S.results[g.id];[['A',g.teamA],['B',g.teamB]].forEach(([s,ids])=>ids.forEach(x=>{let p=M[x];p[s]++;if(z?.a==null||z?.b==null)return;let gf=s==='A'?z.a:z.b,ga=s==='A'?z.b:z.a;p.sp++;p.pt+=points(gf,ga);p.gf+=gf;p.ga+=ga;gf>ga?p.w++:gf===ga?p.d++:p.l++}))})});let sort=a=>a.sort((x,y)=>y.pt-x.pt||(y.gf-y.ga)-(x.gf-x.ga)||x.name.localeCompare(y.name));return{f:sort(Object.values(M).filter(x=>!x.keeper)),k:sort(Object.values(M).filter(x=>x.keeper))}}function rr(p,n){return`<div class="rank"><div class="n">${n}</div><div><span class="identity"><span class="nm">${esc(p.name)}</span>${p.keeper?'<span class="tw">TW</span>':''}</span><small>${p.sp} Sp · ${p.w}S ${p.d}U ${p.l}N · ${p.gf}:${p.ga}</small></div><div class="p">${p.pt}<small>${p.gf-p.ga>=0?'+':''}${p.gf-p.ga}</small></div></div>`}function ranking(){let x=stats(),last='',rank=0,rows=x.f.map((p,i)=>{let k=p.pt+'|'+(p.gf-p.ga);if(k!==last)rank=i+1;last=k;return rr(p,rank)}).join(''),all=[...x.f,...x.k];return`<h2>Punkteübersicht</h2><div class="card">${rows||'<p>Noch keine Ergebnisse.</p>'}</div><h3 style="margin-top:18px">Torhüter separat</h3><div class="card">${x.k.map(p=>rr(p,'TW')).join('')}</div><h3 style="margin-top:18px">Komplette Statistik</h3><div class="tableWrap"><table><tr><th>Spieler</th><th>Sp</th><th>Pkt</th><th>S</th><th>U</th><th>N</th><th>Tore</th><th>Diff</th></tr>${all.map(p=>`<tr class="${p.keeper?'keeperRow':''}"><td><span class="identity"><span>${esc(p.name)}</span>${p.keeper?'<span class="tw">TW</span>':''}</span></td><td>${p.sp}</td><td><b>${p.pt}</b></td><td>${p.w}</td><td>${p.d}</td><td>${p.l}</td><td>${p.gf}:${p.ga}</td><td>${p.gf-p.ga>=0?'+':''}${p.gf-p.ga}</td></tr>`).join('')}</table></div>`}
function more(){return`<h2>Mehr</h2><div class="card"><button class="big" onclick="backup()">Sicherung erstellen</button><label class="big" style="display:block;text-align:center;border:1px solid #ccc;border-radius:12px;margin-top:8px">Sicherung einlesen<input type="file" hidden onchange="restore(this.files[0])"></label><p>Version 1.0.2</p></div>`}function backup(){let b=new Blob([JSON.stringify(S,null,2)]),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Hollaender-Turnier-Backup.json';a.click();URL.revokeObjectURL(u)}function restore(f){let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.players||!x.fields)throw 0;if(confirm('Daten ersetzen?')){S=x;save()}}catch{alert('Ungültig')}};r.readAsText(f)}function empty(){return`<div class="card"><h2>Noch kein Spielplan</h2><button class="primary" onclick="go('setup')">Einrichten</button></div>`}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
